name: Backend CI

on:
  push:
    branches:
      - main
      - dev
      - feature/github-actions-ci-cd
  
  pull_request:
    branches:
      - main
      - dev
  
jobs:
  backend-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai_interview_coach_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_interview_coach_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DATABASE_URL: postgresql+psycopg://postgres:password@localhost:5433/ai_interview_coach
        run: |
          pytest backend/tests/ -v